[project]
name = "gat-traffic-prediction"
version = "0.1.0"
description = "Notebook-first GAT traffic prediction workspace"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "networkx>=3.2",
    "torch>=2.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
notebooks = ["jupyterlab>=4.2"]
training = ["torch-geometric>=2.5"]
sumo = ["traci>=1.20"]
test = ["pytest>=8.2", "nbformat>=5.10"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
